<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大学一点通-工资计算器</title>
    <!-- 引入Font Awesome图标 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            padding: 15px;
            background: linear-gradient(135deg, #f8f9fa, #e9ecef);
            min-height: 100vh;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            margin-bottom: 25px;
            padding: 20px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .title {
            font-size: 24px;
            color: #2c3e50;
            margin: 0;
            font-weight: 600;
        }
        .subtitle {
            color: #7f8c8d;
            font-size: 14px;
            margin-top: 8px;
        }
        .input-group {
            margin-bottom: 15px;
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            transition: transform 0.2s;
        }
        .input-group:hover {
            transform: translateY(-2px);
        }
        label {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
            color: #34495e;
            font-weight: 500;
        }
        label i {
            margin-right: 10px;
            color: #3498db;
            width: 20px;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        input:focus {
            border-color: #3498db;
            outline: none;
            box-shadow: 0 0 0 3px rgba(52,152,219,0.1);
        }
        #result {
            text-align: center;
            font-size: 28px;
            color: #27ae60;
            font-weight: bold;
            margin: 25px 0;
            padding: 20px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.08);
            animation: fadeIn 0.5s;
        }
        #workTime {
            text-align: center;
            font-size: 20px;
            color: #3498db;
            font-weight: bold;
            margin: 25px 0;
            padding: 20px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.08);
            animation: fadeIn 0.5s;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 class="title"><i class="fas fa-calculator"></i> 智能工资计算器</h1>
            <p class="subtitle">由「大学一点通」团队开发</p>
            <p class="subtitle">更多信息，欢迎关注“大学一点通”公众号</p>
        </div>

        <div class="input-group">
            <label for="startTime">
                <i class="fas fa-calendar-alt"></i>
                开始时间
            </label>
            <input type="datetime-local" id="startTime">
        </div>

        <div class="input-group">
            <label for="endTime">
                <i class="fas fa-calendar-check"></i>
                结束时间
            </label>
            <input type="datetime-local" id="endTime">
        </div>

        <div class="input-group">
            <label for="leaveDays">
                <i class="fas fa-umbrella-beach"></i>
                请假天数
            </label>
            <input type="number" id="leaveDays" min="0.0" step="0.5" value="0.0" placeholder="最小0.5天">
        </div>

        <div class="input-group">
            <label for="dailySalary">
                <i class="fas fa-yen-sign"></i>
                每日薪资
            </label>
            <input type="number" id="dailySalary" min="0" value="0" placeholder="输入每日薪资">
        </div>

        <div id="workTime">工作时长：0天0小时</div>
        <div id="result">应发工资：0元</div>
    </div>

    <script>
        function calculateSalary() {
            const start = document.getElementById('startTime').value;
            const end = document.getElementById('endTime').value;
            const leaveDays = parseFloat(document.getElementById('leaveDays').value) || 0;
            const dailySalary = parseFloat(document.getElementById('dailySalary').value) || 0;

            if (start && end) {
                const startDate = new Date(start);
                const endDate = new Date(end);
                const diff = endDate - startDate;
                const totalHours = diff / (1000 * 60 * 60);
                const days = Math.floor(totalHours / 24);
                const hours = totalHours % 24;
                const workDays = diff / (24 * 60 * 60 * 1000);
                const salary = (workDays - leaveDays) * dailySalary;
                const finalSalary = salary > 0 ? salary.toFixed(2) : 0;
                document.getElementById('result').innerHTML = `应发工资：${finalSalary}元`;
                document.getElementById('workTime').innerHTML = `工作时长：${days}天${hours.toFixed(0)}小时`;
            }
        }

        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('input', calculateSalary);
        });
    </script>
</body>
</html>
